name: GIYERA SA BUENLAG NI LUCAS - Build Android APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build GIYERA SA BUENLAG NI LUCAS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and build web bundle
        run: |
          npm run lint
          npm run build

      - name: Sync Capacitor Android assets
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK output
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/GiyeraSaBuenlagNiLucas.apk
          ls -lh release-apk/GiyeraSaBuenlagNiLucas.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: GiyeraSaBuenlagNiLucas-APK
          path: release-apk/GiyeraSaBuenlagNiLucas.apk
          if-no-files-found: error

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" release-apk/GiyeraSaBuenlagNiLucas.apk \
            --title "GIYERA SA BUENLAG NI LUCAS ${{ github.ref_name }}" \
            --notes "Built by JMC Labs for Lucas the Pogi." || \
          gh release upload "${{ github.ref_name }}" release-apk/GiyeraSaBuenlagNiLucas.apk --clobber
